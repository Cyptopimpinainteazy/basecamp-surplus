name: Order safety
on:
  push:
    branches: [fix/atomic-paid-orders]
  pull_request:
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'package*.json'
      - '.github/workflows/order-safety.yml'
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: basecamp_order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORDER_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/basecamp_order_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:orders
      - run: npm run test:unit
      - run: npm run build
      - run: python3 scripts/check-seo-build.py
